# Used only by `npm run dev:netlify` (scripts/netlify-dev.sh).
# Same as netlify.toml but WITHOUT payment-blocker edge — that edge on /*
# hangs the local :8888 proxy (TCP accepts, HTTP never responds).

[build]
  command = "npm ci && npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

[dev]
  targetPort = 5173
  port = 8888

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[headers]]
  for = "/ms21837910.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
