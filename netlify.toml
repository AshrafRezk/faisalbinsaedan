[build]
  command = "npm ci && npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

# Proxy /api requests to Netlify Functions to bypass aggressive adblockers/firewalls
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Microsoft 365 domain verification for fbs.com.sa (must stay at site root)
[[headers]]
  for = "/ms21837910.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

# SPA fallback — static files in dist/ (e.g. ms21837910.txt, robots.txt) are served first
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[edge_functions]]
  path = "/*"
  function = "payment-blocker"
